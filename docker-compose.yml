# Local Postgres for development: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: somax
      POSTGRES_PASSWORD: somax
      POSTGRES_DB: somax
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
